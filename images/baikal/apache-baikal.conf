ServerName baikal
<VirtualHost *:80>
    DocumentRoot /var/www/baikal/html
    RewriteEngine On
    RewriteRule ^/\.well-known/carddav$ /dav.php [R=301,L]
    RewriteRule ^/\.well-known/caldav$ /dav.php [R=301,L]
    <Directory /var/www/baikal/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <Directory /var/www/baikal/config>
        Require all denied
    </Directory>
    <Directory /var/www/baikal/Specific>
        Require all denied
    </Directory>
</VirtualHost>
